services:
  postgres:
    image: postgres:16
    container_name: document-generator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: document_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: document-generator-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/document_generator?schema=public
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
    container_name: document-generator-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
